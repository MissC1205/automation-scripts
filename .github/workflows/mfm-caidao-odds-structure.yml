name: MFM Caidao Odds Shape Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mfm-data/mfm_caidao_odds_structure.py'
      - '.github/workflows/mfm-caidao-odds-structure.yml'
permissions:
  contents: write
concurrency:
  group: mfm-caidao-odds-structure
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect public odds shapes and JavaScript call sites
        run: python mfm-data/mfm_caidao_odds_structure.py
      - name: Commit evidence with no credentials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mfm-data/source-diagnostics/
          git diff --cached --quiet || (git commit -m "audit: public Caidao odds response structure" && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caidao-odds-shape-${{ github.run_id }}
          path: mfm-data/source-diagnostics/*_caidao_odds_structure.json
          retention-days: 30
