name: MFM Caidao SPF History Collection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mfm-data/mfm_caidao_history.py'
      - 'mfm-data/test_mfm_caidao_history.py'
      - '.github/workflows/mfm-caidao-history.yml'
permissions:
  contents: write
concurrency:
  group: mfm-caidao-history
  cancel-in-progress: false
jobs:
  collect-public-spf-history:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test data validation without network
        run: python -m unittest discover -s mfm-data -p 'test_mfm_caidao_history.py' -v
      - name: Collect publicly readable historical SPF snapshots
        run: python mfm-data/mfm_caidao_history.py
      - name: Commit source-stamped audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mfm-data/caidao-history/
          if ! git diff --cached --quiet; then
            git commit -m "audit: Caidao third-party SPF time-series"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caidao-spf-history-${{ github.run_id }}
          path: mfm-data/caidao-history/
          retention-days: 45
