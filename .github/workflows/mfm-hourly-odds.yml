name: MFM Hourly Official Odds Audit
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: write
concurrency:
  group: mfm-hourly-odds
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch and preserve official raw data or explicit errors
        run: python mfm-data/mfm_official_odds.py
      - name: Commit audit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mfm-data/official-odds/
          git diff --cached --quiet || (git commit -m "audit: hourly official odds source snapshot" && git push)
      - name: Upload independent backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-odds-${{ github.run_id }}
          path: mfm-data/official-odds/
          retention-days: 45
