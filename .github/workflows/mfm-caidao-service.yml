name: MFM Caidao Daily and On-Demand
on:
  workflow_dispatch:
    inputs:
      sale_date:
        description: 'Beijing JC sale date YYYY-MM-DD, blank for today'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'mfm-data/mfm_caidao_service.py'
      - 'mfm-data/test_mfm_caidao_service.py'
      - 'mfm-data/caidao-control/refresh.txt'
      - '.github/workflows/mfm-caidao-service.yml'
  schedule:
    # UTC 02:05/07:05/10:05/13:05/15:05
    # Beijing 10:05/15:05/18:05/21:05/23:05
    - cron: '5 2,7,10,13,15 * * *'
permissions:
  contents: write
concurrency:
  group: mfm-caidao-production-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SALE_DATE: ${{ inputs.sale_date || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline regression tests
        run: |
          python -m unittest discover -s mfm-data -p 'test_mfm_caidao_history.py' -v
          python -m unittest discover -s mfm-data -p 'test_mfm_caidao_service.py' -v
      - name: Fetch today or requested sale-day public datasets
        run: python mfm-data/mfm_caidao_service.py
      - name: Commit archival snapshots with conflict handling
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mfm-data/caidao-live/ || true
          if ! git diff --cached --quiet; then
            git commit -m "data(mfm): audited Caidao daily snapshot"
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main || exit 1
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
      - name: Upload independent artifact backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mfm-caidao-operational-${{ github.run_id }}
          path: mfm-data/caidao-live/
          retention-days: 45
          if-no-files-found: warn
      - name: Enforce data delivery, distinct from workflow completion
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, sys
          f = pathlib.Path('mfm-data/caidao-live/latest-summary.json')
          if not f.exists():
              print('COLLECTION_FAILED: no summary generated')
              sys.exit(2)
          s = json.loads(f.read_text(encoding='utf-8'))
          print('Caidao collection status:', s['quality_gate'], s['coverage'])
          if s['quality_gate'] == 'NO_DATA':
              sys.exit(2)
          PY
