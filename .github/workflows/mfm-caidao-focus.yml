name: MFM Caidao Focused API Contract
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mfm-data/mfm_caidao_focus.py'
      - '.github/workflows/mfm-caidao-focus.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect public football request construction
        run: python mfm-data/mfm_caidao_focus.py
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mfm-data/source-diagnostics/
          git diff --cached --quiet || (git commit -m "audit: Caidao API argument evidence" && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caidao-focus-${{ github.run_id }}
          path: mfm-data/source-diagnostics/*_caidao_focus.json
