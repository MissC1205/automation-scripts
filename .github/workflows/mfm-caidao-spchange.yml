name: MFM Caidao SP Change Page Contract
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mfm-data/mfm_caidao_spchange_inspect.py'
      - '.github/workflows/mfm-caidao-spchange.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect public odds change page
        run: python mfm-data/mfm_caidao_spchange_inspect.py
      - name: Archive audit with concurrent branch protection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mfm-data/source-diagnostics/
          if ! git diff --cached --quiet; then
            git commit -m "audit: public SP-change page request contract"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caidao-spchange-audit-${{ github.run_id }}
          path: mfm-data/source-diagnostics/*_caidao_spchange_code.json
