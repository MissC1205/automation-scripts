name: MFM Hourly Analysis Handoff
on:
  workflow_dispatch:
  schedule:
    - cron: '55 1-15 * * *'
permissions:
  contents: write
concurrency:
  group: mfm-analysis-handoff
  cancel-in-progress: false
jobs:
  build-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build evidence and analysis queue
        run: python mfm-data/mfm_analysis_handoff.py
      - name: Commit analysis queue
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mfm-data/analysis-queue/
          if ! git diff --cached --quiet; then
            git commit -m "data(mfm): hourly analysis evidence queue"
            for i in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mfm-analysis-handoff-${{ github.run_id }}
          path: mfm-data/analysis-queue/
          retention-days: 30
