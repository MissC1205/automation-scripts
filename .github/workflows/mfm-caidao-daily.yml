name: MFM Caidao Daily Feature Coverage
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mfm-data/mfm_caidao_daily.py'
      - '.github/workflows/mfm-caidao-daily.yml'
permissions:
  contents: write
jobs:
  public-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect available fixture and field coverage
        run: python mfm-data/mfm_caidao_daily.py
      - name: Commit coverage report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mfm-data/caidao-coverage/
          if ! git diff --cached --quiet; then
            git commit -m "audit: Caidao daily field coverage"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caidao-daily-${{ github.run_id }}
          path: mfm-data/caidao-coverage/
          retention-days: 45
