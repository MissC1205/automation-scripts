name: MFM Caidao Fixture Verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mfm-data/mfm_caidao_fixtures.py'
      - '.github/workflows/mfm-caidao-fixtures.yml'
permissions:
  contents: write
jobs:
  validate-public-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify public GET match list with app parameters
        run: python mfm-data/mfm_caidao_fixtures.py
      - name: Commit source-stamped findings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mfm-data/source-diagnostics/
          git diff --cached --quiet || (git commit -m "audit: public Caidao fixture response" && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caidao-fixture-test-${{ github.run_id }}
          path: mfm-data/source-diagnostics/*_caidao_fixtures.json
