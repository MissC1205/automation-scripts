name: MFM Free Soccer Data Probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mfm-data/**'
      - '.github/workflows/mfm-free-data.yml'
  schedule:
    - cron: '17 2,10,18 * * *'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect source-stamped ESPN events
        run: python mfm-data/mfm_espn.py --out mfm_data --leagues eng.1,ita.1,esp.1,ger.1,fra.1,por.1,bra.1,swe.1,nor.1,fin.1,fra.2,afc.champions
      - name: Enrich with standings and match summaries
        if: success()
        run: python mfm-data/mfm_enrich.py --date $(TZ=Asia/Shanghai date +%F) --dir mfm_data
      - name: Collect completed historical matches and team form
        if: success()
        run: python mfm-data/mfm_history.py --date $(TZ=Asia/Shanghai date +%F) --dir mfm_data --days 21
      - name: Probe API-Football with repository secret
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python mfm-data/mfm_api_football.py --out mfm_data --date $(TZ=Asia/Shanghai date +%F)
      - name: Collect API-Football team form
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        if: ${{ false }} # Disabled: API-Football Free rejects current-season team history
        run: python mfm-data/mfm_api_teams.py --dir mfm_data --date $(TZ=Asia/Shanghai date +%F) --max-teams 20
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mfm-source-audit-${{ github.run_id }}
          path: mfm_data/
          if-no-files-found: warn
          retention-days: 14

# API-Football secret verification trigger 2026-10-12
