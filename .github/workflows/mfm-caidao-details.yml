name: MFM Caidao Match Details Verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mfm-data/mfm_caidao_details.py'
      - '.github/workflows/mfm-caidao-details.yml'
permissions:
  contents: write
jobs:
  verify-details:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify public match history read endpoints
        run: python mfm-data/mfm_caidao_details.py
      - name: Save source-stamped diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mfm-data/source-diagnostics/
          if git diff --cached --quiet; then
            echo "No new audit data to save"
            exit 0
          fi
          git commit -m "audit: Caidao match-detail contract"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Source-stamped audit committed"
              exit 0
            fi
            sleep 2
          done
          echo "Audit generated but branch push failed after retries"
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caidao-details-${{ github.run_id }}
          path: mfm-data/source-diagnostics/*_caidao_details.json
