name: MFM Caidao Handicap History Probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mfm-data/mfm_caidao_handicap_probe.py'
      - '.github/workflows/mfm-caidao-handicap.yml'
permissions:
  contents: write
jobs:
  probe-market:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test permitted public market selectors
        run: python mfm-data/mfm_caidao_handicap_probe.py
      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mfm-data/source-diagnostics/
          if ! git diff --cached --quiet; then
            git commit -m "audit: public handicap market selector"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caidao-handicap-probe-${{ github.run_id }}
          path: mfm-data/source-diagnostics/*_caidao_handicap_probe.json
