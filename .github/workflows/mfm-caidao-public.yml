name: MFM Caidao Public H5 Discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mfm-data/mfm_caidao_probe.py'
      - '.github/workflows/mfm-caidao-public.yml'
permissions:
  contents: write
jobs:
  inspect-public-page:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check public page DNS, HTTP and same-origin JS
        run: python mfm-data/mfm_caidao_probe.py
      - name: Commit diagnostic snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mfm-data/source-diagnostics/
          git diff --cached --quiet || (git commit -m "audit: public Caidao H5 diagnostic" && git push)
      - name: Upload diagnostic backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caidao-public-${{ github.run_id }}
          path: mfm-data/source-diagnostics/
          retention-days: 30
