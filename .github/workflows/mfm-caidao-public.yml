name: MFM Caidao Public H5 Discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mfm-data/mfm_caidao_probe.py'
      - 'mfm-data/mfm_caidao_js_audit.py'
      - 'mfm-data/mfm_caidao_api_probe.py'
      - 'mfm-data/mfm_caidao_chunks.py'
      - 'mfm-data/mfm_caidao_contract.py'
      - '.github/workflows/mfm-caidao-public.yml'
permissions:
  contents: write
jobs:
  inspect-public-page:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check public page DNS, HTTP and same-origin JS
        run: python mfm-data/mfm_caidao_probe.py
      - name: Inspect public JavaScript for API paths
        run: python mfm-data/mfm_caidao_js_audit.py
      - name: Probe known public data-read API paths
        run: python mfm-data/mfm_caidao_api_probe.py
      - name: Inspect public football page chunks for read-only parameters
        run: python mfm-data/mfm_caidao_chunks.py
      - name: Document football JS API request keys
        run: python mfm-data/mfm_caidao_contract.py
      - name: Commit diagnostic snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mfm-data/source-diagnostics/
          if git diff --cached --quiet; then
            echo "No new audit data to save"
            exit 0
          fi
          git commit -m "audit: public Caidao H5 diagnostic"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Source-stamped audit committed"
              exit 0
            fi
            sleep 2
          done
          echo "Audit generated but branch push failed after retries"
          exit 1
      - name: Upload diagnostic backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caidao-public-${{ github.run_id }}
          path: mfm-data/source-diagnostics/
          retention-days: 30
