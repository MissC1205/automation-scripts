name: MFM Caidao SP History Contract Check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mfm-data/mfm_caidao_sp_probe.py'
      - '.github/workflows/mfm-caidao-sp.yml'
permissions:
  contents: write
jobs:
  public-sp:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test SP history parameter contracts
        run: python mfm-data/mfm_caidao_sp_probe.py
      - name: Commit non-sensitive audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mfm-data/source-diagnostics/
          git diff --cached --quiet || (git commit -m "audit: Caidao SP history status" && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caidao-sp-audit-${{ github.run_id }}
          path: mfm-data/source-diagnostics/*_caidao_sp_history.json
